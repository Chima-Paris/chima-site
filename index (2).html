<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chima — Coffee shop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@400;500;600;700&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FAF9F5; color: #2C3722; font-family: 'Inter', Arial, sans-serif; }
.wordmark { font-family: 'Bagel Fat One', cursive; letter-spacing: 0.5px; }

.utility { background: #2C3722; color: #FAF9F5dd; display: flex; align-items: center; justify-content: space-between; padding: 9px 48px; font-size: 12px; }
.utility-left { display: flex; gap: 26px; align-items: center; }
.utility-item { display: flex; align-items: center; gap: 7px; }
.utility-social { display: flex; gap: 14px; font-size: 13px; }

.nav { background: #FAF9F5; border-bottom: 1px solid #2C372218; padding: 0 48px; display: flex; align-items: center; justify-content: space-between; height: 76px; position: sticky; top: 0; z-index: 5; }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-img { height: 52px; width: auto; border-radius: 8px; display: block; }
.logo-text { font-size: 24px; color: #2C3722; }
.nav-links { display: flex; gap: 30px; }
.nav-link { font-size: 12px; color: #2C3722aa; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
.nav-link.active { color: #2C3722; border-bottom: 2px solid #7E8876; padding-bottom: 4px; }

.hero { position: relative; height: 520px; background: #2C3722; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: contain; object-position: center; display: block; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(0deg, #2C3722cc 0%, transparent 45%); }
.hero-caption { position: absolute; bottom: 60px; left: 0; background: #2C3722cc; padding: 26px 40px; max-width: 560px; }
.hero-title { font-family: 'Bagel Fat One', cursive; color: #FAF9F5; font-size: 42px; line-height: 1.1; margin-bottom: 8px; }
.hero-sub { font-size: 15px; color: #FAF9F5cc; font-style: italic; }

.info-section { display: grid; grid-template-columns: 1fr 1fr; }
.info-img { background: #7E887633; position: relative; min-height: 480px; overflow: hidden; }
.info-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.info-text-wrap { background: #F3F1E9; padding: 56px 56px; display: flex; flex-direction: column; justify-content: center; }
.info-title { font-family: 'Bagel Fat One', cursive; font-size: 28px; color: #2C3722; margin-bottom: 20px; }
.info-para { font-size: 14px; color: #2C3722cc; line-height: 1.8; margin-bottom: 22px; }
.info-hours { font-size: 14px; color: #3B4631; font-weight: 700; margin-bottom: 6px; }
.info-hours span { font-weight: 400; color: #2C3722aa; }
.info-divider { height: 1px; background: #2C372222; margin: 20px 0; }
.info-detail { font-size: 14px; color: #2C3722; margin-bottom: 8px; }
.info-detail strong { color: #3B4631; }
.info-cta { margin-top: 20px; display: inline-flex; align-items: center; gap: 8px; background: #2C3722; color: #FAF9F5; font-size: 12px; font-weight: 700; padding: 13px 26px; border-radius: 4px; letter-spacing: 0.5px; text-transform: uppercase; width: fit-content; }

.section { padding: 72px 48px; }
.eyebrow { font-size: 10px; color: #7E8876; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; font-weight: 700; }
.section-title { font-family: 'Bagel Fat One', cursive; font-size: 30px; margin-bottom: 12px; }
.section-sub { font-size: 13px; color: #2C372288; max-width: 480px; line-height: 1.7; margin-bottom: 40px; }
.offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 1px solid #2C372218; }
.offer { padding: 28px 24px; border-right: 1px solid #2C372218; border-bottom: 1px solid #2C372218; }
.offer:last-child { border-right: none; }
.offer-icon { width: 34px; height: 34px; border-radius: 50%; background: #7E887622; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 14px; }
.offer-title { font-family: 'Bagel Fat One', cursive; font-size: 17px; margin-bottom: 8px; }
.offer-desc { font-size: 12px; color: #2C372277; line-height: 1.7; }

.location { padding: 0 48px 72px; }
.map-wrap { border-radius: 20px; overflow: hidden; border: 1px solid #2C372218; height: 340px; }
.map-wrap iframe { width: 100%; height: 100%; border: 0; filter: grayscale(0.15) contrast(1.02); }

footer { padding: 28px 48px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2C372214; background: #FAF9F5; }
.footer-text { font-size: 10px; color: #2C372255; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="utility">
  <div class="utility-left">
    <div class="utility-item">📍 <span id="u-address"></span></div>
  </div>
  <div class="utility-social">📘 🐦 📷</div>
</div>

<nav class="nav">
  <div class="logo">
    <img class="logo-img" src="/images/logo.jpg" alt="Chima">
  </div>
  <div class="nav-links">
    <a class="nav-link active" href="/">Accueil</a>
    <a class="nav-link" href="/menu.html">Menu</a>
    <div class="nav-link">À propos</div>
    <div class="nav-link">Nous trouver</div>
  </div>
</nav>

<div class="hero">
  <img id="hero-img" src="" alt="Chima">
  <div class="hero-gradient"></div>
  <div class="hero-caption">
    <div class="hero-title wordmark" id="hero-title"></div>
    <div class="hero-sub" id="hero-sub"></div>
  </div>
</div>

<div class="info-section">
  <div class="info-img"><img id="about-img" src="" alt="Intérieur Chima"></div>
  <div class="info-text-wrap">
    <div class="info-title wordmark" id="about-title">CHIMA</div>
    <div class="info-para" id="about-text"></div>
    <div class="info-hours">Horaires : <span id="hours-weekday"></span></div>
    <div class="info-divider"></div>
    <div class="info-detail"><strong>Adresse :</strong> <span id="detail-address"></span></div>
    <div class="info-detail"><strong>Métro :</strong> <span id="detail-metro"></span></div>
    <div class="info-detail"><strong>Email :</strong> <span id="detail-email"></span></div>
    <a class="info-cta" href="/menu.html" id="cta-text">Voir le menu →</a>
  </div>
</div>

<div class="section">
  <div class="eyebrow" id="offers-eyebrow">Chez Chima</div>
  <div class="section-title" id="offers-title">Ce qu'on propose</div>
  <div class="section-sub" id="offers-sub">Un aperçu de la carte — le détail complet est sur la page Menu.</div>
  <div class="offer-grid" id="offer-grid"></div>
</div>

<div class="location">
  <div class="map-wrap">
    <iframe id="map-frame" src="" loading="lazy"></iframe>
  </div>
</div>

<footer>
  <div class="logo-text wordmark" style="font-size:15px;">chima</div>
  <div class="footer-text" id="footer-text">© 2026 · Coffee shop</div>
</footer>

<script>
// Charge les infos du site depuis data/site.json et remplit la page.
// C'est ce fichier que tu modifies depuis /admin (interface Decap CMS).
fetch('/data/site.json')
  .then(r => r.json())
  .then(d => {
    document.getElementById('u-address').textContent = d.address;
    document.getElementById('hero-img').src = d.hero_image;
    document.getElementById('hero-title').textContent = d.hero_title;
    document.getElementById('hero-sub').textContent = d.hero_subtitle;
    document.getElementById('about-img').src = d.about_image;
    document.getElementById('about-text').textContent = d.about_text;
    document.getElementById('hours-weekday').textContent = d.hours_weekday;
    document.getElementById('detail-address').textContent = d.address;
    document.getElementById('detail-metro').textContent = d.metro;
    document.getElementById('detail-email').textContent = d.email;
    document.getElementById('about-title').textContent = d.about_title || 'CHIMA';
    document.getElementById('cta-text').textContent = d.cta_text || 'Voir le menu →';
    document.getElementById('offers-eyebrow').textContent = d.offers_eyebrow || 'Chez Chima';
    document.getElementById('offers-title').textContent = d.offers_title || "Ce qu'on propose";
    document.getElementById('offers-sub').textContent = d.offers_sub || '';
    document.getElementById('footer-text').textContent = d.footer_text || '© 2026 · Coffee shop';
    document.getElementById('map-frame').src =
      'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(d.map_embed_bbox) +
      '&layer=mapnik&marker=' + d.map_marker;

    // Section "Ce qu'on propose" — construite depuis d.offers
    const grid = document.getElementById('offer-grid');
    (d.offers || []).forEach(o => {
      const div = document.createElement('div');
      div.className = 'offer';
      div.innerHTML = `
        <div class="offer-icon">${o.icon}</div>
        <div class="offer-title">${o.title}</div>
        <div class="offer-desc">${o.description}</div>
      `;
      grid.appendChild(div);
    });
  })
  .catch(err => console.error('Erreur de chargement des données du site :', err));
</script>

</body>
</html>
