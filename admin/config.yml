backend:
  name: git-gateway
  repo: Chima-Paris/chima-site
  branch: main
  identity_url: https://auth.decapbridge.com/sites/bf7e7046-9fdb-48f2-ae84-db74d7523ec1
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Là où sont stockées les photos que tu ajoutes depuis l'interface
media_folder: "images"
public_folder: "/images"

site_url: https://chima-paris.fr
display_url: https://chima-paris.fr

collections:

  # --- Informations générales du site (accueil, horaires, adresse...) ---
  - name: "site"
    label: "Infos du site"
    files:
      - file: "data/site.json"
        label: "Accueil & infos pratiques"
        name: "site"
        fields:
          - { label: "Titre principal (hero)", name: "hero_title", widget: "string" }
          - { label: "Sous-titre (hero)", name: "hero_subtitle", widget: "string" }
          - { label: "Photo hero (grande image du haut)", name: "hero_image", widget: "image" }
          - { label: "Photo section 'À propos'", name: "about_image", widget: "image" }
          - { label: "Texte de présentation", name: "about_text", widget: "text" }
          - { label: "Horaires", name: "hours_weekday", widget: "string" }
          - { label: "Adresse", name: "address", widget: "string" }
          - { label: "Métro", name: "metro", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Titre de la section 'À propos' (accueil)", name: "about_title", widget: "string" }
          - { label: "Texte du bouton 'Voir le menu'", name: "cta_text", widget: "string" }
          - { label: "Sur-titre 'Ce qu'on propose'", name: "offers_eyebrow", widget: "string" }
          - { label: "Titre 'Ce qu'on propose'", name: "offers_title", widget: "string" }
          - { label: "Sous-titre 'Ce qu'on propose'", name: "offers_sub", widget: "string" }
          - { label: "Sur-titre page Menu", name: "menu_eyebrow", widget: "string" }
          - { label: "Titre page Menu", name: "menu_title", widget: "string" }
          - { label: "Sous-titre page Menu", name: "menu_sub", widget: "string" }
          - { label: "Texte du pied de page", name: "footer_text", widget: "string" }
          - label: "Ce qu'on propose (3 blocs sur l'accueil)"
            name: "offers"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Icône (emoji)", name: "icon", widget: "string" }
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }

  # --- Menu / carte du café ---
  - name: "menu"
    label: "Menu"
    files:
      - file: "data/menu.json"
        label: "Carte complète"
        name: "menu"
        fields:
          - label: "Catégories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Nom de la catégorie", name: "name", widget: "string" }
              - { label: "Catégorie mise en avant (avec photos)", name: "featured", widget: "boolean", default: false }
              - label: "Produits"
                name: "items"
                widget: "list"
                summary: "{{name}} — {{price}}"
                fields:
                  - { label: "Nom", name: "name", widget: "string" }
                  - { label: "Prix", name: "price", widget: "string" }
                  - { label: "Description", name: "description", widget: "string", required: false }
                  - { label: "Photo (optionnelle)", name: "image", widget: "image", required: false }
