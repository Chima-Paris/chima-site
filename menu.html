<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chima — Menu</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@300;400;500;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FAFAF7; color: #1C1F17; font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
.wordmark { font-family: 'Bagel Fat One', cursive; letter-spacing: 0.3px; font-weight: 400; }
a { text-decoration: none; color: inherit; }

/* NAV */
.nav { background: #FAFAF7; padding: 0 56px; display: flex; align-items: center; justify-content: space-between; height: 88px; position: sticky; top: 0; z-index: 10; }
.logo { display: flex; align-items: center; }
.logo-img { height: 40px; width: auto; display: block; }
.nav-links { display: flex; gap: 44px; }
.nav-link { font-size: 11px; color: #1C1F17; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; opacity: 0.55; transition: opacity 0.2s; }
.nav-link.active { opacity: 1; }

/* PAGE HEADER */
.page-header { max-width: 1400px; margin: 0 auto; padding: 96px 56px 56px; }
.page-eyebrow { font-size: 10px; color: #8A8F7A; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; font-weight: 500; }
.page-title { font-family: 'Inter', Arial, sans-serif; font-weight: 400; font-size: 38px; letter-spacing: -0.3px; margin-bottom: 20px; }
.page-sub { font-size: 14px; color: #1C1F17aa; max-width: 520px; line-height: 1.75; font-weight: 300; }

/* JUMP NAV */
.jump-nav { max-width: 1400px; margin: 0 auto; display: flex; gap: 36px; flex-wrap: wrap; padding: 0 56px 40px; border-bottom: 1px solid #1C1F1718; }
.jump-link { font-size: 11px; color: #1C1F1799; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; padding-bottom: 6px; border-bottom: 1px solid transparent; cursor: pointer; }
.jump-link.active { color: #1C1F17; border-bottom-color: #1C1F17; }

/* CATEGORY */
.menu-wrap { max-width: 900px; margin: 0 auto; padding: 80px 56px; }
.category { margin-bottom: 88px; }
.cat-title { font-family: 'Inter', Arial, sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
.cat-line { width: 100%; height: 1px; background: #1C1F1718; margin: 20px 0 40px; }

.menu-item { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 20px 0; border-bottom: 1px solid #1C1F1712; }
.menu-item:first-child { padding-top: 0; }
.item-name { font-family: 'Inter', Arial, sans-serif; font-weight: 400; font-size: 15px; letter-spacing: 0.1px; white-space: nowrap; }
.item-dots { flex: 1; }
.item-price { font-size: 13px; font-weight: 400; color: #1C1F17; white-space: nowrap; letter-spacing: 0.3px; }
.item-desc { font-size: 12px; color: #1C1F1788; line-height: 1.6; font-weight: 300; margin-top: 3px; max-width: 480px; }
.item-row { width: 100%; }

/* SIGNATURE — larger, image-forward */
.signature-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
.sig-item { display: flex; flex-direction: column; }
.sig-img { aspect-ratio: 4/5; background: #EDECE4; overflow: hidden; margin-bottom: 20px; }
.sig-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.sig-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.sig-name { font-family: 'Inter', Arial, sans-serif; font-weight: 500; font-size: 14px; }
.sig-price { font-size: 13px; font-weight: 400; color: #1C1F17; }
.sig-desc { font-size: 12px; color: #1C1F1788; line-height: 1.6; font-weight: 300; }

/* FOOTER */
footer { border-top: 1px solid #1C1F1718; padding: 40px 56px; display: flex; justify-content: space-between; align-items: center; }
.footer-logo { font-family: 'Bagel Fat One', cursive; font-size: 15px; letter-spacing: 0.5px; }
.footer-text { font-size: 10px; color: #1C1F1766; letter-spacing: 0.5px; font-weight: 300; }

@media (max-width: 860px) {
  .signature-list { grid-template-columns: 1fr; }
  .nav, .page-header, .jump-nav, .menu-wrap, footer { padding-left: 24px; padding-right: 24px; }
  .page-title { font-size: 34px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="/">
    <img class="logo-img" src="/images/logo.jpg" alt="Chima">
  </a>
  <div class="nav-links">
    <a class="nav-link" href="/">Accueil</a>
    <a class="nav-link active" href="/menu.html">Menu</a>
    <a class="nav-link" href="/#about-anchor">À propos</a>
    <a class="nav-link" href="/#location-anchor">Nous trouver</a>
  </div>
</nav>

<div class="page-header">
  <div class="page-eyebrow" id="menu-eyebrow">Notre carte</div>
  <div class="page-title" id="menu-title">Le menu</div>
  <div class="page-sub" id="menu-sub"></div>
</div>

<div class="jump-nav" id="jump-nav"></div>

<div class="menu-wrap" id="menu-wrap"></div>

<footer>
  <div class="footer-logo">chima</div>
  <div class="footer-text" id="footer-text">© 2026 · Coffee shop</div>
</footer>

<script>
fetch('/data/site.json').then(r => r.json()).then(d => {
  document.getElementById('menu-eyebrow').textContent = d.menu_eyebrow || 'Notre carte';
  document.getElementById('menu-title').textContent = d.menu_title || 'Le menu';
  document.getElementById('menu-sub').textContent = d.menu_sub || '';
  document.getElementById('footer-text').textContent = d.footer_text || '© 2026 · Coffee shop';
});

fetch('/data/menu.json')
  .then(r => r.json())
  .then(data => {
    const wrap = document.getElementById('menu-wrap');
    const jump = document.getElementById('jump-nav');

    data.categories.forEach((cat, i) => {
      const jumpLink = document.createElement('div');
      jumpLink.className = 'jump-link' + (i === 0 ? ' active' : '');
      jumpLink.textContent = cat.name;
      jumpLink.onclick = () => document.getElementById('cat-' + i).scrollIntoView({ behavior: 'smooth' });
      jump.appendChild(jumpLink);

      const section = document.createElement('div');
      section.className = 'category';
      section.id = 'cat-' + i;

      let itemsHTML = '';
      if (cat.featured) {
        itemsHTML = '<div class="signature-list">' + cat.items.map(item => `
          <div class="sig-item">
            <div class="sig-img">${item.image ? `<img src="${item.image}" alt="${item.name}">` : ''}</div>
            <div class="sig-top"><div class="sig-name">${item.name}</div><div class="sig-price">${item.price}</div></div>
            <div class="sig-desc">${item.description || ''}</div>
          </div>`).join('') + '</div>';
      } else {
        itemsHTML = cat.items.map(item => `
          <div class="item-row">
            <div class="menu-item">
              <div class="item-name">${item.name}</div>
              <div class="item-price">${item.price}</div>
            </div>
            ${item.description ? `<div class="item-desc">${item.description}</div>` : ''}
          </div>`).join('');
      }

      section.innerHTML = `
        <div class="cat-title">${cat.name}</div>
        <div class="cat-line"></div>
        ${itemsHTML}
      `;
      wrap.appendChild(section);
    });
  })
  .catch(err => console.error('Erreur de chargement du menu :', err));
</script>

</body>
</html>
