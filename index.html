<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Chima — Coffee shop</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@300;400;500;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #FAFAF7; color: #1C1F17; font-family: 'Inter', Arial, sans-serif; font-weight: 300; }
.wordmark { font-family: 'Bagel Fat One', cursive; letter-spacing: 0.3px; font-weight: 400; }
a { text-decoration: none; color: inherit; }

/* NAV */
.nav { background: transparent; padding: 0 56px; display: flex; align-items: center; justify-content: space-between; height: 88px; position: fixed; top: 0; left: 0; right: 0; z-index: 10; transition: background 0.3s ease, border-color 0.3s ease; border-bottom: 1px solid transparent; }
.nav.scrolled { background: #FAFAFAee; backdrop-filter: blur(8px); border-bottom: 1px solid #1C1F1712; }
.logo { display: flex; align-items: center; }
.logo-img { height: 72px; width: auto; display: block; }
.nav-links { display: flex; gap: 44px; }
.nav-link { font-size: 11px; color: #FAFAF7; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; opacity: 0.75; transition: opacity 0.2s, color 0.3s ease; }
.nav.scrolled .nav-link { color: #1C1F17; }
.nav-link.active { opacity: 1; }

/* HERO */
.hero { position: relative; height: 88vh; min-height: 620px; background: #14170f; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
.hero-gradient { position: absolute; inset: 0; background: linear-gradient(0deg, #0b0d08 0%, #0b0d0888 28%, transparent 55%); }
.hero-caption { position: absolute; bottom: 72px; left: 56px; right: 56px; }
.hero-eyebrow { font-size: 10px; color: #FAFAF7aa; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 18px; font-weight: 500; }
.hero-title { font-family: 'Inter', Arial, sans-serif; font-weight: 400; color: #FAFAF7; font-size: 44px; line-height: 1.15; letter-spacing: -0.3px; max-width: 720px; }
.hero-sub { font-size: 14px; color: #FAFAF7cc; margin-top: 16px; font-weight: 300; letter-spacing: 0.2px; max-width: 480px; line-height: 1.6; }

/* ABOUT — clean, no card background */
.about { max-width: 1400px; margin: 0 auto; padding: 100px 56px; display: grid; grid-template-columns: 1fr 1fr; gap: 96px; align-items: start; }
.about-img { position: relative; height: 520px; overflow: hidden; background: #FAFAF7; }
.about-img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.about-eyebrow { font-size: 10px; color: #8A8F7A; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; font-weight: 500; }
.about-title { font-family: 'Inter', Arial, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -0.2px; margin-bottom: 24px; color: #1C1F17; }
.about-text { font-size: 15px; color: #1C1F17aa; line-height: 1.85; margin-bottom: 36px; font-weight: 300; max-width: 440px; }
.about-meta { display: flex; flex-direction: column; gap: 14px; margin-bottom: 36px; }
.meta-row { display: flex; gap: 20px; font-size: 13px; color: #1C1F17; }
.meta-label { color: #8A8F7A; min-width: 76px; letter-spacing: 0.5px; text-transform: uppercase; font-size: 10px; padding-top: 2px; }
.about-cta { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; border-bottom: 1px solid #1C1F17; padding-bottom: 6px; width: fit-content; }

/* OFFERS — minimal, no boxes */
.offers { max-width: 1400px; margin: 0 auto; padding: 0 56px 140px; }
.offers-eyebrow { font-size: 10px; color: #8A8F7A; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; font-weight: 500; }
.offers-title { font-family: 'Inter', Arial, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -0.2px; margin-bottom: 16px; }
.offers-sub { font-size: 14px; color: #1C1F17aa; max-width: 480px; line-height: 1.7; font-weight: 300; margin-bottom: 64px; }
.offer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; }
.offer { border-top: 1px solid #1C1F1722; padding-top: 24px; }
.offer-num { font-family: 'Inter', Arial, sans-serif; font-weight: 500; font-size: 11px; letter-spacing: 1px; color: #8A8F7A; margin-bottom: 20px; display: block; }
.offer-title { font-family: 'Inter', Arial, sans-serif; font-weight: 500; font-size: 15px; letter-spacing: 0.2px; margin-bottom: 12px; }
.offer-desc { font-size: 13px; color: #1C1F17aa; line-height: 1.7; font-weight: 300; }

/* LOCATION */
.location { max-width: 1400px; margin: 0 auto; padding: 0 56px 140px; }
.location-eyebrow { font-size: 10px; color: #8A8F7A; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 20px; font-weight: 500; }
.location-title { font-family: 'Inter', Arial, sans-serif; font-weight: 400; font-size: 26px; letter-spacing: -0.2px; margin-bottom: 40px; }
.map-wrap { border: 1px solid #1C1F1718; height: 420px; }
.map-wrap iframe { width: 100%; height: 100%; border: 0; filter: grayscale(0.4) contrast(1.02); }

/* FOOTER */
footer { border-top: 1px solid #1C1F1718; padding: 40px 56px; display: flex; justify-content: space-between; align-items: center; }
.footer-logo { font-family: 'Bagel Fat One', cursive; font-size: 15px; letter-spacing: 0.5px; }
.footer-text { font-size: 10px; color: #1C1F1766; letter-spacing: 0.5px; font-weight: 300; }

@media (max-width: 860px) {
  .about { grid-template-columns: 1fr; padding: 80px 24px; gap: 48px; }
  .offer-grid { grid-template-columns: 1fr; gap: 40px; }
  .nav, .location, .offers, footer { padding-left: 24px; padding-right: 24px; }
  .hero-title { font-size: 38px; }
}
</style>
</head>
<body>

<nav class="nav">
  <a class="logo" href="/">
    <img class="logo-img" src="/images/logo-full.png" alt="Chima">
  </a>
  <div class="nav-links">
    <a class="nav-link active" href="/">Accueil</a>
    <a class="nav-link" href="/menu.html">Menu</a>
    <a class="nav-link" href="#about-anchor">À propos</a>
    <a class="nav-link" href="#location-anchor">Nous trouver</a>
  </div>
</nav>

<div class="hero">
  <img id="hero-img" src="" alt="Chima">
  <div class="hero-gradient"></div>
  <div class="hero-caption">
    <div class="hero-eyebrow">Coffee shop — 11e arrondissement</div>
    <div class="hero-title" id="hero-title"></div>
    <div class="hero-sub" id="hero-sub"></div>
  </div>
</div>

<div class="about" id="about-anchor">
  <div class="about-img"><img id="about-img" src="" alt="Intérieur Chima"></div>
  <div>
    <div class="about-eyebrow">L'endroit</div>
    <div class="about-title" id="about-title">Chima</div>
    <div class="about-text" id="about-text"></div>
    <div class="about-meta">
      <div class="meta-row"><span class="meta-label">Horaires</span><span id="hours-weekday"></span></div>
      <div class="meta-row"><span class="meta-label">Adresse</span><span id="detail-address"></span></div>
      <div class="meta-row"><span class="meta-label">Métro</span><span id="detail-metro"></span></div>
      <div class="meta-row"><span class="meta-label">Email</span><span id="detail-email"></span></div>
    </div>
    <a class="about-cta" href="/menu.html" id="cta-text">Voir le menu →</a>
  </div>
</div>

<div class="offers">
  <div class="offers-eyebrow" id="offers-eyebrow">Chez Chima</div>
  <div class="offers-title" id="offers-title">Ce qu'on propose</div>
  <div class="offers-sub" id="offers-sub"></div>
  <div class="offer-grid" id="offer-grid"></div>
</div>

<div class="location" id="location-anchor">
  <div class="location-eyebrow">Nous trouver</div>
  <div class="location-title">Passez nous voir</div>
  <div class="map-wrap">
    <iframe id="map-frame" src="" loading="lazy"></iframe>
  </div>
</div>

<footer>
  <div class="footer-logo">chima</div>
  <div class="footer-text" id="footer-text">© 2026 · Coffee shop</div>
</footer>

<script>
fetch('/data/site.json')
  .then(r => r.json())
  .then(d => {
    document.getElementById('hero-img').src = d.hero_image;
    document.getElementById('hero-title').textContent = d.hero_title;
    document.getElementById('hero-sub').textContent = d.hero_subtitle;
    document.getElementById('about-img').src = d.about_image;
    document.getElementById('about-text').textContent = d.about_text;
    document.getElementById('hours-weekday').textContent = d.hours_weekday;
    document.getElementById('detail-address').textContent = d.address;
    document.getElementById('detail-metro').textContent = d.metro;
    document.getElementById('detail-email').textContent = d.email;
    document.getElementById('about-title').textContent = d.about_title || 'Chima';
    document.getElementById('cta-text').textContent = d.cta_text || 'Voir le menu →';
    document.getElementById('offers-eyebrow').textContent = d.offers_eyebrow || 'Chez Chima';
    document.getElementById('offers-title').textContent = d.offers_title || "Ce qu'on propose";
    document.getElementById('offers-sub').textContent = d.offers_sub || '';
    document.getElementById('footer-text').textContent = d.footer_text || '© 2026 · Coffee shop';
    document.getElementById('map-frame').src =
      'https://www.openstreetmap.org/export/embed.html?bbox=' + encodeURIComponent(d.map_embed_bbox) +
      '&layer=mapnik&marker=' + d.map_marker;

    const grid = document.getElementById('offer-grid');
    (d.offers || []).forEach((o, i) => {
      const div = document.createElement('div');
      div.className = 'offer';
      div.innerHTML = `
        <span class="offer-num">${String(i + 1).padStart(2, '0')}</span>
        <div class="offer-title">${o.title}</div>
        <div class="offer-desc">${o.description}</div>
      `;
      grid.appendChild(div);
    });
  })
  .catch(err => console.error('Erreur de chargement des données du site :', err));
</script>

<script>
window.addEventListener('scroll', () => {
  document.querySelector('.nav').classList.toggle('scrolled', window.scrollY > 60);
});
</script>

</body>
</html>
